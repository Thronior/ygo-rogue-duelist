<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop layout preview</title><link rel="stylesheet" href="mobile.css"></head><body><main id="app"></main><script type="module">
const app=document.querySelector('#app');
const content=await fetch('content.json').then(r=>r.json());
const card=id=>content.cards.find(c=>c.id===Number(id));
const character=()=>content.characters[0];
const singles=['Dark Magician','Supply','Hino-Kagu-Tsuchi','Giant Trunade','Butterfly Dagger - Elma','Dark Zebra','Drillago','The Flute of Summoning Dragon','Dice Jar','Gray Wing'].map(n=>content.cards.find(c=>c.name===n)).filter(Boolean);
const relicIds=Object.keys(content.artifacts).filter(id=>content.artifactInfo[id]?.art).slice(0,3);
const state={run:{character:0,gold:116,lp:8000,round:1,started_at:'visual-preview',shop_reward:{label:'Destruction cards'},shop:[...singles.map(c=>({kind:'single',id:c.id,price:15})),...content.packs.slice(0,2).map(p=>({kind:'pack',id:p.id,price:35})),...relicIds.map(id=>({kind:'artifact',id,price:content.artifacts[id][1]}))]}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const image=id=>`assets/cards/${id}.jpg`;
const uiIcons={settings:'settings',draft:'deck',start:'duel','relic-ledger':'relics','buy-selected':'coins',shop:'shop',achievements:'achievements',tutorial:'tutorial'};
const btn=(label,action,extra='',cls='')=>`<button class="${cls}" data-do="${action}" ${extra}>${uiIcons[action]?`<img class="ui-icon" src="assets/ui/${uiIcons[action]}.png" alt="">`:""}${label}</button>`;
function shell(title,body,tools='',cls=''){app.innerHTML=`<div class="page ${cls}"><header><h2>${title}</h2><div class="tools">${tools}${btn('Settings','settings')}${btn('Menu','title')}</div></header>${body}</div>`}
let shopSelection=new Set(),shopInventoryKey=null;
function renderShop(){const r=state.run;const key=JSON.stringify([r.started_at,r.round,r.shop.map(x=>[x.kind,x.id,x.price])]);if(key!==shopInventoryKey){shopSelection.clear();shopInventoryKey=key}for(const i of shopSelection)if(!r.shop[i]||r.shop[i].sold)shopSelection.delete(i);const product=(x,i)=>{let name,img,description='';if(x.kind==='single'){name=card(x.id).name;img=image(x.id)}else if(x.kind==='deck'){name=x.name+' · REPLACES COLLECTION';img='assets/decks/'+x.art+'.jpg'}else if(x.kind==='pack'){name=content.packs.find(p=>p.id===x.id).name;img='assets/packs/'+x.id+'.jpg'}else{const a=content.artifacts[x.id];name=a[0];description=a[2];img=image(content.artifactInfo[x.id].art)}return `<div class="shop-product"><div class="product-art"><img ${x.kind==='single'?`data-inspect="${x.id}"`:x.kind==='artifact'||x.kind==='deck'||x.kind==='pack'?`data-do="item-info" data-index="${i}"`:''} src="${img}"><span class="price-badge">${x.sold?'SOLD':`<span>${x.price}</span><img class="price-coin" src="assets/ui/coins.png" alt="gold">`}</span><button class="purchase-check" role="checkbox" aria-checked="${shopSelection.has(i)}" aria-label="Select ${esc(name)}" data-do="select-purchase" data-index="${i}" ${x.sold||((character().copycat||character().engine_deck)&&x.kind!=='artifact')?'disabled':''}><span class="purchase-tick" aria-hidden="true"></span></button></div>${x.kind==='artifact'?`<small>${esc(name)}</small>`:''}</div>`};
 shell('',`<div class="shop-layout"><div class="shop-stock"><h3>${esc(r.shop_reward?.label||'Featured stock')}</h3><div class="shelf singles-featured">${r.shop.map((x,i)=>({x,i})).filter(({x})=>x.kind==='single').slice(0,5).map(({x,i})=>product(x,i)).join('')}</div><h3 class="general-stock-heading">General stock</h3><div class="shelf singles-general">${r.shop.map((x,i)=>({x,i})).filter(({x})=>x.kind==='single').slice(5).map(({x,i})=>product(x,i)).join('')}</div><h3>Booster packs</h3><div class="packs">${r.shop.map((x,i)=>['pack','deck'].includes(x.kind)?product(x,i):'').join('')}</div></div><aside><div class="shop-counter"><img class="keeper" src="assets/shopkeeper.png"><div class="shop-balance" aria-label="${r.gold} gold"><img src="assets/ui/coins.png" alt=""><strong>${r.gold.toLocaleString()}</strong></div><button class="primary shop-buy" data-do="buy-selected" ${shopSelection.size?'':'disabled'}><b>BUY</b><span><img src="assets/ui/coins.png" alt="Gold"><strong>${[...shopSelection].reduce((n,i)=>n+(r.shop[i]?.sold?0:r.shop[i]?.price||0),0)}</strong></span></button><button class="shop-next" data-do="routes" aria-label="Next Duel!"><span>Next<br>Duel!</span></button></div><h3>Relics ${(character().copycat||character().engine_deck)?'— relics only':''}</h3><div class="relics">${r.shop.map((x,i)=>x.kind==='artifact'?product(x,i):'').join('')}</div><div class="shop-reference-buttons">${btn('Coin scorecard','scorecard')}${btn('Relics','relic-ledger')}</div></aside></div>`,`<span class="shop-header-lp">${r.lp.toLocaleString()} LP</span>${btn('Edit deck','draft')}`,'shop shop-compact')}
renderShop();
document.addEventListener('click',e=>{const b=e.target.closest('[data-do="select-purchase"]');if(!b)return;const i=Number(b.dataset.index);if(shopSelection.has(i))shopSelection.delete(i);else shopSelection.add(i);renderShop()});
</script></body></html>
