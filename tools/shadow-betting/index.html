<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Shadow Betting</title>
<link rel="icon" href="assets/menu/83241722.jpg">
<style>
@font-face{font-family:"YGO Display";src:url(assets/fonts/BebasNeue-Regular.ttf);font-display:swap}
@font-face{font-family:"YGO Card Name";src:url(assets/fonts/SpectralSC-SemiBold.ttf);font-weight:600;font-display:swap}
@font-face{font-family:"YGO Card Text";src:url(assets/fonts/Spectral-Medium.ttf);font-weight:500;font-display:swap}
html,body{margin:0;height:100%;background:#0b0d12;color:#f3ead6;font-family:Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
.sb-loading{position:absolute;inset:0;display:grid;place-content:center;gap:10px;text-align:center;font-family:"YGO Display",Impact,sans-serif;font-size:28px;letter-spacing:.05em;color:#f2cf83}
.sb-loading small{font-family:Arial,sans-serif;font-size:14px;letter-spacing:0;color:#c9bda3}
.db-vol{display:flex;align-items:center;gap:8px}.db-vol input{width:140px}
.sb-start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;
 background:radial-gradient(ellipse at 50% 35%,#1d3a48,#0b0d12 70%)}
.sb-start img{width:min(46vw,260px);aspect-ratio:1;object-fit:cover;border-radius:12px;border:2px solid #b8b5a0;box-shadow:0 10px 30px #000c}
.sb-start h1{margin:6px 0 0;font-family:"YGO Display",Impact,sans-serif;font-weight:400;font-size:clamp(36px,7vw,64px);letter-spacing:.05em;color:#f2cf83}
.sb-start p{margin:0;color:#c9bda3}
.sb-start button{margin-top:8px;font-family:"YGO Display",Impact,sans-serif;font-size:28px;letter-spacing:.08em;padding:10px 44px;border-radius:8px;border:1px solid #f2cf83;background:#946539;color:#fff4d7;cursor:pointer}
.sb-start button:hover{filter:brightness(1.12)}
.sb-update{position:fixed;left:50%;bottom:14px;translate:-50% 0;z-index:100;padding:10px 18px;border-radius:8px;border:2px solid #f2cf83;background:#3a2410;color:#f2cf83;font:700 14px Arial,sans-serif;box-shadow:0 6px 24px #000c;cursor:pointer}
</style>
</head>
<body>
<div id="app"><div class="sb-loading">Shadow Betting<small>Loading…</small></div></div>
<script type="module" src="shadow-betting.js"></script>
</body>
</html>
